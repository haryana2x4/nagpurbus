[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nagpurbus"
version = "0.1.0"
description = "NagpurBus: honest, open-data live bus & multimodal transit platform for Nagpur (Aapli Bus + Nagpur Metro)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "networkx>=3.3",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "gtfs-realtime-bindings>=1.0.0",
    "holidays>=0.58",
    "unidecode>=1.3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["eta_engine*", "planner*", "ingest*", "simulator*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"
